<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Niuva Motion Contract Specimen</title><style>:root{font:16px/1.5 system-ui,sans-serif;color:#112233;background:#f7f5ef}body{margin:0;padding:24px}main{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:20px;border:1px solid #8f9ba2;border-radius:14px;background:#fffdf7}.signal{height:48px;border-radius:8px;background:#0e416b;transition:transform 280ms ease,opacity 180ms ease}.card:hover .signal{transform:translateX(10px)}.reduced .signal{transition:none}.note{color:#4a5b67}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head>
  <body><main><h1>Bounded motion specimen</h1><p class="note">CSS-only local artifact; normal/reduced behavior is illustrative, not runtime proof.</p><div class="grid"><article class="card"><h2>Normal</h2><div class="signal" aria-label="bounded feedback"></div><p>280ms bounded panel/state cue; content remains complete.</p></article><article class="card reduced"><h2>Reduced</h2><div class="signal" aria-label="static feedback"></div><p>Direct state change; no spatial movement or stagger.</p></article></div></main></body>
</html>
