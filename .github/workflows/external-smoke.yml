name: external-smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Approved non-production backend origin (no /api)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install smoke dependencies
        run: python -m pip install pytest requests
      - name: Verify external public read contracts
        env:
          NIUVA_EXTERNAL_API_URL: ${{ inputs.target_url }}
        run: python -m pytest -q backend/tests/external_smoke_test.py
