name: external-smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Approved non-production backend origin; exact HTTPS origin without /api"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-smoke
  cancel-in-progress: false

jobs:
  public-read-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      NIUVA_EXTERNAL_API_URL: ${{ inputs.target_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Validate approved HTTPS origin
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python - <<'PY'
          import os
          from scripts.staging_smoke import validate_origin

          validate_origin(os.environ["TARGET_URL"])
          print("Target accepted as a credential-free HTTPS origin.")
          PY
      - name: Install smoke dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r backend/requirements.lock
      - name: Run unauthenticated staging smoke
        run: |
          set -o pipefail
          python scripts/staging_smoke.py \
            --base-url "$NIUVA_EXTERNAL_API_URL" \
            --json | tee staging-smoke.json
      - name: Verify external public read contracts
        run: >-
          python -m pytest -q backend/tests/external_smoke_test.py
          --junitxml=external-smoke-junit.xml
      - name: Require complete external execution and record evidence
        run: >-
          python scripts/verify_pytest_evidence.py
          --junit external-smoke-junit.xml
          --profile external
          --command "python -m pytest -q backend/tests/external_smoke_test.py"
          --output external-smoke-evidence.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-smoke-${{ github.run_id }}
          path: |
            staging-smoke.json
            external-smoke-junit.xml
            external-smoke-evidence.json
          if-no-files-found: error
          retention-days: 14
