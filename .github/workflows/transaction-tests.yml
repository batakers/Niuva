name: transaction-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/verify_pytest_evidence.py"
      - "scripts/mongodb/**"
      - "docker-compose.transaction-test.yml"
      - ".github/workflows/transaction-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start isolated MongoDB replica set
        run: docker compose -f docker-compose.transaction-test.yml up -d
      - name: Wait for writable primary
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.transaction-test.yml exec -T mongodb-test \
              mongosh --quiet --port 27018 \
              --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.transaction-test.yml logs
          exit 1
      - name: Run mandatory transaction integration tests
        env:
          NIUVA_RUN_REAL_TRANSACTION_TESTS: "1"
          MONGO_TRANSACTION_TEST_URL: mongodb://127.0.0.1:27018/?replicaSet=rs-test&directConnection=true
        run: >-
          python -m pytest -n 0 -q
          backend/tests/test_transaction_integration.py
          backend/tests/test_commercial_transaction_integration.py
          backend/tests/test_content_transaction_integration.py
          backend/tests/test_portfolio_transaction_integration.py
          backend/tests/test_b2b_transaction_integration.py
          backend/tests/test_work_order_allocation_integration.py
          backend/tests/test_inventory_transactions.py
          backend/tests/test_identity_access_migration.py
          backend/tests/test_granular_role_migration.py
          backend/tests/test_auth_recovery_migration.py
          backend/tests/test_auth_session_migration.py
          backend/tests/test_auth_session_transaction_integration.py
          backend/tests/test_customer_session_integration.py
          backend/tests/test_auth_recovery_transaction_integration.py
          backend/tests/test_migration_backup_restore.py
          --junitxml=transaction-junit.xml
      - name: Require complete transaction execution and record evidence
        run: >-
          python scripts/verify_pytest_evidence.py
          --junit transaction-junit.xml
          --profile transaction
          --command "python -m pytest -n 0 -q [mandatory transaction modules]"
          --output transaction-evidence.json
      - name: Upload transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-tests-${{ github.run_id }}
          path: |
            transaction-junit.xml
            transaction-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker compose -f docker-compose.transaction-test.yml down --volumes --remove-orphans
