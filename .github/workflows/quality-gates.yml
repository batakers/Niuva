name: quality-gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit
      - name: Verify dependency health
        run: |
          python -m pip check
          python -m pip_audit -r backend/requirements.txt
      - name: Compile backend
        run: |
          python -m compileall -q backend
          python -m py_compile scripts/load_readonly_api.py
      - name: Critical Python lint
        run: >-
          python -m flake8 backend
          --exclude backend/.venv
          --select E9,F63,F7,F82
      - name: Type-check remediation security and storage boundaries
        run: >-
          python -m mypy
          --follow-imports=skip
          --ignore-missing-imports
          --check-untyped-defs
          backend/api_contract.py
          backend/auth_sessions.py
          backend/auth_rate_limit.py
          backend/auth_password.py
          backend/auth_recovery.py
          backend/auth_session.py
          backend/b2b_routes.py
          backend/catalog_routes.py
          backend/content_domain.py
          backend/inventory_service.py
          backend/csv_safety.py
          backend/schema_manifest.py
          backend/schema_readiness.py
          backend/readiness_health.py
          backend/notification_worker.py
          backend/quote_line_reconciliation_report.py
          backend/storage.py
          backend/transaction_api.py
      - name: Check remediation formatting
        run: |
          python -m black --check \
            backend/api_contract.py \
            backend/auth_sessions.py \
            backend/auth_rate_limit.py \
            backend/auth_password.py \
            backend/auth_recovery.py \
            backend/auth_session.py \
            backend/b2b_routes.py \
            backend/catalog_routes.py \
            backend/content_domain.py \
            backend/inventory_service.py \
            backend/csv_safety.py \
            backend/schema_manifest.py \
            backend/schema_readiness.py \
            backend/readiness_health.py \
            backend/notification_worker.py \
            backend/quote_line_reconciliation_report.py \
            backend/storage.py \
            backend/server.py \
            backend/transaction_api.py \
            backend/migrations/007_security_publication_schema.py \
            backend/migrations/008_auth_recovery_safety.py \
            backend/migrations/009_admin_session_safety.py \
            backend/tests/test_admin_notifications.py \
            backend/tests/test_api_contract.py \
            backend/tests/test_health.py \
            backend/tests/test_readiness_health.py \
            backend/tests/test_readonly_load_probe.py \
            backend/tests/test_inventory_service.py \
            backend/tests/test_quote_line_reconciliation_report.py \
            backend/tests/test_transaction_error_contract.py \
            backend/tests/test_work_order_allocation_integration.py \
            scripts/load_readonly_api.py
          python -m isort --profile black --check-only \
            backend/api_contract.py \
            backend/auth_sessions.py \
            backend/auth_rate_limit.py \
            backend/auth_password.py \
            backend/auth_recovery.py \
            backend/auth_session.py \
            backend/b2b_routes.py \
            backend/catalog_routes.py \
            backend/content_domain.py \
            backend/inventory_service.py \
            backend/csv_safety.py \
            backend/schema_manifest.py \
            backend/schema_readiness.py \
            backend/readiness_health.py \
            backend/notification_worker.py \
            backend/quote_line_reconciliation_report.py \
            backend/storage.py \
            backend/server.py \
            backend/transaction_api.py \
            backend/migrations/007_security_publication_schema.py \
            backend/migrations/008_auth_recovery_safety.py \
            backend/migrations/009_admin_session_safety.py \
            backend/tests/test_admin_notifications.py \
            backend/tests/test_api_contract.py \
            backend/tests/test_health.py \
            backend/tests/test_readiness_health.py \
            backend/tests/test_readonly_load_probe.py \
            backend/tests/test_inventory_service.py \
            backend/tests/test_quote_line_reconciliation_report.py \
            backend/tests/test_transaction_error_contract.py \
            backend/tests/test_work_order_allocation_integration.py \
            scripts/load_readonly_api.py
      - name: Run complete backend suite
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify production dependency policy
        run: npm run audit:production
      - name: Run frontend tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        env:
          CI: "true"
          REACT_APP_PUBLIC_SITE_URL: ""
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run hermetic browser contracts
        env:
          PLAYWRIGHT_START_SERVER: "true"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          REACT_APP_BACKEND_URL: "http://127.0.0.1:8000"
        run: |
          npx playwright test e2e/retail-discovery.spec.js \
            --project=mobile \
            --project=desktop
          npx playwright test e2e/admin-session-cross-tab.spec.js \
            --project=desktop

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history for credentials
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
