name: external-admin-e2e

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Approved staging frontend origin; exact HTTPS origin"
        required: true
        type: string
      api_url:
        description: "Approved staging API origin; exact HTTPS origin without /api"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-admin-e2e
  cancel-in-progress: false

jobs:
  admin-browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.frontend_url }}
      PLAYWRIGHT_API_URL: ${{ inputs.api_url }}
      E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
      E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
      E2E_SALES_EMAIL: ${{ secrets.E2E_SALES_EMAIL }}
      E2E_SALES_PASSWORD: ${{ secrets.E2E_SALES_PASSWORD }}
      E2E_WAREHOUSE_EMAIL: ${{ secrets.E2E_WAREHOUSE_EMAIL }}
      E2E_WAREHOUSE_PASSWORD: ${{ secrets.E2E_WAREHOUSE_PASSWORD }}
      E2E_CONTENT_EMAIL: ${{ secrets.E2E_CONTENT_EMAIL }}
      E2E_CONTENT_PASSWORD: ${{ secrets.E2E_CONTENT_PASSWORD }}
      E2E_PRODUCTION_EMAIL: ${{ secrets.E2E_PRODUCTION_EMAIL }}
      E2E_PRODUCTION_PASSWORD: ${{ secrets.E2E_PRODUCTION_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate approved HTTPS targets
        run: |
          node <<'NODE'
          const names = ["PLAYWRIGHT_BASE_URL", "PLAYWRIGHT_API_URL"];
          const parsed = {};
          const placeholderHosts = new Set(["example", "invalid", "test", "example.com", "example.org", "example.net"]);
          const placeholderSuffixes = [".example", ".invalid", ".test", ".example.com", ".example.org", ".example.net"];

          for (const name of names) {
            const raw = process.env[name];
            if (!raw || raw.trim() !== raw) {
              throw new Error(`${name} is required and must not contain surrounding whitespace`);
            }
            const target = new URL(raw);
            const host = target.hostname.toLowerCase();
            if (
              target.protocol !== "https:" ||
              target.username ||
              target.password ||
              target.pathname !== "/" ||
              target.search ||
              target.hash ||
              ["localhost", "127.0.0.1", "::1"].includes(host) ||
              (placeholderHosts.has(host) || placeholderSuffixes.some((suffix) => host.endsWith(suffix)))
            ) {
              throw new Error(`${name} must be an approved, credential-free HTTPS origin`);
            }
            parsed[name] = target.origin;
          }

          if (parsed.PLAYWRIGHT_BASE_URL === parsed.PLAYWRIGHT_API_URL) {
            throw new Error("Frontend and API origins must be distinct deployment origins");
          }
          NODE
      - name: Verify role-matrix credentials are injected
        shell: bash
        run: |
          set -euo pipefail
          required=(
            E2E_SUPER_ADMIN_EMAIL E2E_SUPER_ADMIN_PASSWORD
            E2E_SALES_EMAIL E2E_SALES_PASSWORD
            E2E_WAREHOUSE_EMAIL E2E_WAREHOUSE_PASSWORD
            E2E_CONTENT_EMAIL E2E_CONTENT_PASSWORD
            E2E_PRODUCTION_EMAIL E2E_PRODUCTION_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error title=Missing staging E2E secret::$variable is not injected"
              exit 1
            fi
          done
      - name: Verify API liveness and CORS from frontend origin
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --max-time 20 \
            -H "Origin: ${PLAYWRIGHT_BASE_URL}" \
            -D "$headers" \
            -o "$body" \
            -w "%{http_code}" \
            "${PLAYWRIGHT_API_URL}/api/health/live")"
          test "$status" = "200"
          tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${PLAYWRIGHT_BASE_URL}"
          tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-credentials: true"
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Admin role, accessibility, and responsive contracts
        run: >-
          npx playwright test
          e2e/accessibility.spec.js
          e2e/responsive.spec.js
          e2e/role-matrix.spec.js
          --project=mobile
          --project=tablet
          --project=laptop
          --project=desktop
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-admin-e2e-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
