name: external-admin-e2e

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Approved staging frontend origin (https://...)"
        required: true
        type: string
      api_url:
        description: "Approved staging API origin (https://...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-admin-e2e
  cancel-in-progress: false

jobs:
  admin-browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.frontend_url }}
      PLAYWRIGHT_API_URL: ${{ inputs.api_url }}
      E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
      E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
      E2E_SALES_EMAIL: ${{ secrets.E2E_SALES_EMAIL }}
      E2E_SALES_PASSWORD: ${{ secrets.E2E_SALES_PASSWORD }}
      E2E_WAREHOUSE_EMAIL: ${{ secrets.E2E_WAREHOUSE_EMAIL }}
      E2E_WAREHOUSE_PASSWORD: ${{ secrets.E2E_WAREHOUSE_PASSWORD }}
      E2E_CONTENT_EMAIL: ${{ secrets.E2E_CONTENT_EMAIL }}
      E2E_CONTENT_PASSWORD: ${{ secrets.E2E_CONTENT_PASSWORD }}
      E2E_PRODUCTION_EMAIL: ${{ secrets.E2E_PRODUCTION_EMAIL }}
      E2E_PRODUCTION_PASSWORD: ${{ secrets.E2E_PRODUCTION_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate approved HTTPS targets
        run: >-
          node -e '
          for (const name of ["PLAYWRIGHT_BASE_URL", "PLAYWRIGHT_API_URL"]) {
            const target = new URL(process.env[name]);
            if (
              target.protocol !== "https:" ||
              target.username ||
              target.password ||
              target.pathname !== "/" ||
              target.search ||
              target.hash
            ) {
              throw new Error(`${name} must be a credential-free HTTPS origin`);
            }
          }'
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Admin role, accessibility, and responsive contracts
        run: >-
          npx playwright test
          e2e/accessibility.spec.js
          e2e/responsive.spec.js
          e2e/role-matrix.spec.js
          --project=mobile
          --project=tablet
          --project=laptop
          --project=desktop
